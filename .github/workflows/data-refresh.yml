name: China fund prediction loop

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "30 2 * * 6"
  workflow_dispatch:
    inputs:
      phase:
        description: Pipeline phase
        required: true
        type: choice
        options: [morning, evening, weekly, monthly, yearly, all]
        default: evening
      date:
        description: Optional Asia/Shanghai date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: china-fund-prediction-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      health: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Asia/Shanghai phase
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/resolve-run.ts
      - name: Generate, verify, and build
        id: generate
        env:
          RUN_PHASE: ${{ steps.params.outputs.phase }}
          RUN_DATE: ${{ steps.params.outputs.date }}
        run: |
          set -euo pipefail
          args=("--phase=$RUN_PHASE")
          if [[ -n "$RUN_DATE" ]]; then
            args+=("--date=$RUN_DATE")
          fi
          npm run data:generate -- "${args[@]}"
          npm run lint
          npm run typecheck
          npm test
          npm run data:verify
          npm run build
      - name: Check business health
        id: health
        if: ${{ always() && steps.params.outcome == 'success' }}
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.params.outputs.date }}
          RUN_PHASE: ${{ steps.params.outputs.phase }}
        run: npx tsx scripts/check-health.ts
      - name: Commit changed data atomically
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "chore(data): refresh China fund prediction loop [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Report collection status
        if: always()
        env:
          GENERATION: ${{ steps.generate.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          RUN_DATE: ${{ steps.params.outputs.date }}
          RUN_PHASE: ${{ steps.params.outputs.phase }}
        run: |
          printf '### Collection\nBusiness date: %s; phase: %s\nGeneration/validation: %s\nBusiness health: %s\nData commit: %s\n' \
            "$RUN_DATE" "$RUN_PHASE" "$GENERATION" "$HEALTH" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Report deployment status
        if: always()
        env:
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          printf '### Deployment\nPages deployment: %s\n' "$DEPLOYMENT" >> "$GITHUB_STEP_SUMMARY"

  monitor:
    needs: [refresh, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      COLLECTION: ${{ needs.refresh.result }}
      DEPLOYMENT: ${{ needs.deploy.result }}
      HEALTH: ${{ needs.refresh.outputs.health }}
    steps:
      - name: Enforce collection, deployment, and business health
        run: |
          printf '### Overall status\nCollection: %s\nDeployment: %s\nBusiness health: %s\n' \
            "$COLLECTION" "$DEPLOYMENT" "$HEALTH" >> "$GITHUB_STEP_SUMMARY"
          [[ "$COLLECTION" == "success" && "$DEPLOYMENT" == "success" && "$HEALTH" == "success" ]]
