name: China fund prediction loop

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Pipeline phase
        required: true
        type: choice
        options: [morning, evening, weekly, monthly, yearly, all]
        default: all
      date:
        description: Optional Asia/Shanghai date (YYYY-MM-DD)
        required: false
        type: string
      calendar_override:
        description: Explicitly override missing calendar coverage for a manual replay
        required: false
        type: boolean
        default: false

concurrency:
  group: china-fund-prediction-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve Asia/Shanghai phase
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_CALENDAR_OVERRIDE: ${{ inputs.calendar_override }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            phase="$INPUT_PHASE"
          elif [[ "$SCHEDULE" == "30 2 * * 1-5" ]]; then
            phase="morning"
          else
            phase="evening"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          echo "schedule=$SCHEDULE" >> "$GITHUB_OUTPUT"
          echo "calendar_override=$INPUT_CALENDAR_OVERRIDE" >> "$GITHUB_OUTPUT"
      - name: Generate, verify, and build
        env:
          RUN_PHASE: ${{ steps.params.outputs.phase }}
          RUN_DATE: ${{ steps.params.outputs.date }}
          RUN_SCHEDULE: ${{ steps.params.outputs.schedule }}
          CALENDAR_OVERRIDE: ${{ steps.params.outputs.calendar_override }}
        run: |
          set -euo pipefail
          args=("--phase=$RUN_PHASE" "--actual-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          if [[ -n "$RUN_DATE" ]]; then
            args+=("--date=$RUN_DATE")
          fi
          if [[ -n "$RUN_SCHEDULE" ]]; then
            args+=("--schedule=$RUN_SCHEDULE")
          fi
          if [[ "$CALENDAR_OVERRIDE" == "true" ]]; then
            args+=("--calendar-override")
          fi
          npm run data:generate -- "${args[@]}"
          npm run calendar:verify
          npm run lint
          npm run typecheck
          npm test
          npm run data:verify
          npm run build
      - name: Commit changed data atomically
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "chore(data): refresh China fund prediction loop [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
